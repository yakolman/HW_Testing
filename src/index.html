<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Validator</title>
    <style></style>
</head>
<body>
    <ul class="card-systems">
        <li class="card-system" data-system="mir">
            <img src="" alt="MIR" 
            class="card-system-image">
        </li>
        <li class="card-system" data-system="unionpay">
            <img src="" alt="China UnionPay" class="card-system-image">
        </li>
        <li class="card-system" data-system="diners-club">
            <img src="" alt="Diners Club International" class="card-system-image">
        </li>
        <li class="card-system" data-system="american-express">
            <img src="" alt="American Express" class="card-system-image">
        </li>
        <li class="card-system" data-system="jcb">
            <img src="" alt="JCB" 
            class="card-system-image">
        </li>
        <li class="card-system" data-system="maestro">
            <img src="" alt="Maestro" class="card-system-image">
        </li>
        <li class="card-system" data-system="mastercard">
            <img src="" alt="Mastercard" class="card-system-image">
        </li>
        <li class="card-system" data-system="visa">
            <img src="" alt="Visa" class="card-system-image">
        </li>
    </ul>
    <form class = 'card-form'>
        <input type="text" class="card-number" name="card-number" placeholder="Введите номер карты" size="29" maxlength="19" inputmode="numeric">
        <button class="validate" type="submit">Click to Validate</button>
    </form>
    <p class="result">Введите номер карты</p>
</body>
</html>
